[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myvw"
version = "0.1.0"
description = "Async Python klient pre myvolkswagen.net — prihlásenie a extrakcia dát vozidiel bez Playwright"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
cli = ["python-dotenv>=1.0"]

[project.scripts]
myvw = "myvw.cli:main"

[tool.setuptools.packages.find]
include = ["myvw*"]
